# YouTube source plugin config, API-key instance: polls the uploads of the listed
# channels through the YouTube Data API.
#
# Channels are 24-character channel IDs starting with UC; channel handles
# (@name) are not supported. Every call costs one quota unit: see "Rate limits
# and quota" in plugins/README.md before listing many channels.

[host]
poll_interval_secs = 900
allowlist = ["www.googleapis.com"]

[host.secrets]
api_key = "YOUTUBE_API_KEY"

[settings]
channels = ["UC_x5XG1OV2P6uZZ5FSM9Ttw"]
