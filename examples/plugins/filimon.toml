# Sample plugin registry: component and config paths resolve relative to this file's directory.

[sources.stub]
component = "../../plugins/stub-source/target/wasm32-unknown-unknown/release/stub_source.wasm"
config = "stub.toml"
enabled = true
fetcher = "stub-fetcher"

# `reddit` and `reddit-user` are two instances of one component: the instance name is
# what you register, log in with and what keys the cursor and token files.
[sources.reddit]
component = "../../plugins/reddit/target/wasm32-unknown-unknown/release/reddit_source.wasm"
config = "reddit.toml"
enabled = true
fetcher = "http"

[sources.reddit-user]
component = "../../plugins/reddit/target/wasm32-unknown-unknown/release/reddit_source.wasm"
config = "reddit-user.toml"
enabled = true
fetcher = "http"

# Likewise `youtube` (API key) and `youtube-user` (login) share one component.
[sources.youtube]
component = "../../plugins/youtube/target/wasm32-unknown-unknown/release/youtube_source.wasm"
config = "youtube.toml"
enabled = true
fetcher = "http"

[sources.youtube-user]
component = "../../plugins/youtube/target/wasm32-unknown-unknown/release/youtube_source.wasm"
config = "youtube-user.toml"
enabled = true
fetcher = "http"

[fetchers.stub-fetcher]
component = "../../plugins/stub-fetcher/target/wasm32-unknown-unknown/release/stub_fetcher.wasm"

[fetchers.http]
component = "../../plugins/http-fetcher/target/wasm32-unknown-unknown/release/http_fetcher.wasm"

# Optional: make `fili produce` fetch its pages through a fetcher component
# instead of the built-in HTTP client. `fetcher` names an enabled entry under
# [fetchers]. `timeout_secs` is the deadline of one page and defaults to 15.
# `allowlist` adds hosts to the hosts of the seed urls; any other host,
# including a redirect target, is denied.
#
# [crawler]
# fetcher = "http"
# timeout_secs = 15
# allowlist = ["www.example.com"]
