# RSS / Atom source plugin config: polls syndication feeds and returns one item
# per entry. No API key and no login are needed.
#
# Every feed host must be listed in `allowlist` (an exact host match), and the
# source needs a fetcher in filimon.toml (`fetcher = "http"`).

[host]
poll_interval_secs = 900
allowlist = ["context.ph"]

[settings]
# One or more http(s) feed URLs (at most 30).
feeds = ["https://context.ph/feed/"]
# Newest entries kept per feed per poll (1-100, default 25). `feeds` times this
# may not exceed 1000, the host's per-poll item cap.
# max_items_per_feed = 25
# Item text is cut to this many characters (200-100000, default 20000).
# max_text_chars = 20000
