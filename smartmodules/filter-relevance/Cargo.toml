[package]
name = "filter-relevance"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Fluvio SmartModule: Filter articles by relevance score threshold"
authors = ["filimon"]

[lib]
crate-type = ['cdylib']

[dependencies]
fluvio-smartmodule = "0.50"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
