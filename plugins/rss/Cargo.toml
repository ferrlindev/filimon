[package]
name = "rss-source"
version = "0.1.0"
edition = "2024"
publish = false
description = "filimon RSS/Atom source plugin: polls syndication feeds and returns one item per entry."
authors = ["filimon"]

[lib]
# `rlib` lets the unit tests link the plain-Rust core; `cdylib` is what cargo-component turns into the component.
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen-rt = { version = "0.41", features = ["bitflags"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
# Pure-Rust XML pull parser; it never expands custom entities, so a hostile
# feed cannot mount an entity-expansion attack.
quick-xml = "0.37"
# RFC 2822 (RSS pubDate) and RFC 3339 (Atom) parsing only; `std::time` has no
# clock on wasm32-unknown-unknown.
time = { version = "0.3", default-features = false, features = ["parsing"] }

[package.metadata.component]
package = "filimon:rss-source"

[package.metadata.component.target]
path = "../../wit"
world = "source"

# Own workspace, so the root filimon workspace does not capture this crate.
[workspace]
