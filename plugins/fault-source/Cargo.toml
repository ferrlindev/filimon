[package]
name = "fault-source"
version = "0.1.0"
edition = "2024"
publish = false
description = "Fault-injection filimon source plugin: a test fixture for the Phase 3 host, not a registry example."
authors = ["filimon"]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { version = "0.41", features = ["bitflags"] }
serde = { version = "1", features = ["derive"] }
toml = "1"

[package.metadata.component]
package = "filimon:fault-source"

[package.metadata.component.target]
path = "../../wit"
world = "source"

# Own workspace, so the root filimon workspace does not capture this crate.
[workspace]
