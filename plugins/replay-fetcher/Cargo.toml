[package]
name = "replay-fetcher"
version = "0.1.0"
edition = "2024"
publish = false
description = "Replay filimon fetcher plugin: serves frozen fixtures as if they were live data. A test fixture and the plugin guide's worked example, never registered for a real source."
authors = ["filimon"]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { version = "0.41", features = ["bitflags"] }

[package.metadata.component]
package = "filimon:replay-fetcher"

[package.metadata.component.target]
path = "../../wit"
world = "fetcher"

# Own workspace, so the root filimon workspace does not capture this crate.
[workspace]
