[package]
name = "filimon"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[[bin]]
name = "fili"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
scraper = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
url = "2"
regex = "1"
tempfile = "3"
watchexec = "8"
watchexec-events = "6"
watchexec-signals = "5"
tokio = { version = "1", features = ["full"] }
miette = { version = "7", features = ["fancy"] }
toml = "1"
thiserror = "2"
gline-rs = "1.0"
orp = "0.9"

# Fluvio streaming platform
fluvio = "0.50"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# WebAssembly plugin host (Phase 3)
wasmtime = { version = "48", default-features = false, features = ["component-model", "cranelift", "runtime", "async", "std", "parallel-compilation"] }
base64 = "0.22"
tokio-util = "0.7"

[dev-dependencies]
# test-util enables paused time (`#[tokio::test(start_paused = true)]`).
tokio = { version = "1", features = ["test-util"] }

[workspace]
members = [
    ".",
    "smartmodules/filter-relevance",
    "smartmodules/map-preprocess",
    "smartmodules/map-extract",
]
exclude = ["plugins"]

[profile.release-lto]
inherits = "release"
lto = true
opt-level = "s"
