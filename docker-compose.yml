# ═══════════════════════════════════════════════════════════════════════════════
# filimon – docker-compose.yaml
#
# Services:
#   fluvio-sc        – Fluvio Streaming Controller
#   fluvio-spu       – Fluvio Streaming Processing Unit
#   filimon          – the WISE crawler (default)
#   model-downloader – one-shot helper to pull a GLiNER model from Hugging Face
#                      run with: docker compose --profile setup up model-downloader
#
# Fluvio Streaming Mode:
#   docker compose up -d fluvio-sc fluvio-spu
#   docker compose run --rm filimon produce https://techcrunch.com
#   docker compose run --rm filimon consume --from-beginning
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ── Fluvio Streaming Controller (SC) ──────────────────────────────────────────
  fluvio-sc:
    image: infinyon/fluvio:latest
    container_name: fluvio-sc
    entrypoint: ["/fluvio-run", "sc"]
    ports:
      - "9003:9003"   # SC API (internal)
      - "9005:9005"   # SC public endpoint
    environment:
      RUST_LOG: "info"
    volumes:
      - fluvio-data:/var/lib/fluvio
    command: ["--local", "/var/lib/fluvio/metadata", "--bind-public", "0.0.0.0:9005", "--bind-private", "0.0.0.0:9003"]
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/net/tcp | grep -q ':232B' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # ── Fluvio Streaming Processing Unit (SPU) ───────────────────────────────────
  fluvio-spu:
    image: infinyon/fluvio:latest
    container_name: fluvio-spu
    entrypoint: ["/fluvio-run", "spu"]
    depends_on:
      fluvio-sc:
        condition: service_healthy
    ports:
      - "9010:9010"   # SPU public endpoint
      - "9011:9011"   # SPU private endpoint
    environment:
      RUST_LOG: "info"
    volumes:
      - fluvio-spu-data:/var/lib/fluvio
    command:
      - "--id"
      - "0"
      - "--sc-addr"
      - "fluvio-sc:9003"
      - "--public-server"
      - "0.0.0.0:9010"
      - "--private-server"
      - "0.0.0.0:9011"
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/net/tcp | grep -q ':2332' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # ── Main crawler service ────────────────────────────────────────────────────
  filimon:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime

    image: filimon:latest
    container_name: filimon

    depends_on:
      fluvio-sc:
        condition: service_healthy
      fluvio-spu:
        condition: service_healthy

    volumes:
      # GLiNER model files – read-only; the container never writes model weights.
      - ./models:/app/models:ro
      # Extraction results – wise_output.json is written here by Stage 4.
      - ./output:/app/output
      # Fluvio profile for cluster connection
      - fluvio-profile:/root/.fluvio

    environment:
      RUST_LOG: "info,filimon=debug"

      # Paths consumed by NerEngine::new() in scorer.rs.
      # Change the model variant here without rebuilding the image.
      TOKENIZER_PATH: "/app/models/gliner_small-v2.1/tokenizer.json"
      MODEL_PATH: "/app/models/gliner_small-v2.1/onnx/model.onnx"
      OUTPUT_PATH: "/app/output/wise_output.json"

      # ONNX Runtime CPU thread cap – tune to your host core count.
      ORT_NUM_THREADS: "4"

      # Fluvio cluster endpoint (for container-to-container communication)
      FLUVIO_CLUSTER_ADDR: "fluvio-sc:9003"

    # Default command – override at runtime:
    #   docker compose run --rm filimon crawl https://techcrunch.com
    #   docker compose run --rm filimon crawl --stream https://techcrunch.com
    #   docker compose run --rm filimon produce https://techcrunch.com
    #   docker compose run --rm filimon consume --from-beginning
    #   docker compose run --rm filimon stream --stage all
    #   docker compose run --rm filimon file /app/models/sample.html
    #   docker compose run --rm filimon --ls /watch
    command: ["--help"]

    restart: "no" # one-shot crawler; change to "unless-stopped" for watch mode

    # Uncomment to cap resource usage on shared hosts.
    # GLiNER small requires ~1.5 GB; allow at least 2 GB headroom.
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "4"
    #       memory: 6g

  # ── Stream Processor Service (optional) ──────────────────────────────────────
  # Runs the unified stream processor continuously.
  # Listens on filimon-raw-pages. The SmartModule chain output is read
  # directly by `fili consume` rather than written to a topic.
  filimon-stream-processor:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: filimon:latest
    container_name: filimon-stream-processor
    profiles: ["streaming"]

    depends_on:
      fluvio-sc:
        condition: service_healthy
      fluvio-spu:
        condition: service_healthy

    volumes:
      - ./models:/app/models:ro
      - fluvio-profile:/root/.fluvio

    environment:
      RUST_LOG: "info,filimon=debug"
      TOKENIZER_PATH: "/app/models/gliner_small-v2.1/tokenizer.json"
      MODEL_PATH: "/app/models/gliner_small-v2.1/onnx/model.onnx"
      FLUVIO_CLUSTER_ADDR: "fluvio-sc:9003"

    command: ["stream", "--stage", "all", "--from-beginning"]
    restart: unless-stopped

  # ── One-shot model downloader ───────────────────────────────────────────────
  # Downloads a GLiNER model from Hugging Face into ./models.
  # Gated behind the "setup" profile so it never starts with `docker compose up`.
  #
  # Usage:
  #   docker compose --profile setup up model-downloader
  #
  # Override MODEL_ID to download a different variant:
  #   MODEL_ID=knowledgator/gliner-multitask-large-v0.5 \
  #     docker compose --profile setup up model-downloader
  model-downloader:
    image: python:3.12-slim
    profiles: ["setup"]

    volumes:
      - ./models:/models

    environment:
      MODEL_ID: "urchade/gliner_small-v2.1"
      LOCAL_DIR: "/models/gliner_small-v2.1"
      # HF_TOKEN: "${HF_TOKEN}"   # uncomment for gated/private repos

    command:
      - bash
      - -c
      - |
        pip install -q huggingface_hub &&
        python - <<'PYEOF'
        import os
        from huggingface_hub import snapshot_download
        snapshot_download(
            repo_id=os.environ['MODEL_ID'],
            local_dir=os.environ['LOCAL_DIR'],
            ignore_patterns=['*.pt', '*.bin', 'flax_model*', 'tf_model*'],
        )
        print('Model ready at', os.environ['LOCAL_DIR'])
        PYEOF

volumes:
  fluvio-data:
    driver: local
  fluvio-spu-data:
    driver: local
  fluvio-profile:
    driver: local
